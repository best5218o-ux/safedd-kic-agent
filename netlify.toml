[build]
  publish = "public"
[functions]
  directory = "netlify/functions"
[[redirects]]
  from = "/api/edgar"
  to = "/.netlify/functions/edgar"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
